# 부스 시연 대시보드 설정.
#
# 물리 상수의 정본은 mobile-robot 쪽이다. 여기 값은 그 사본이고, 출처를 옆에 적어 둔다.
# 로봇 쪽 값이 바뀌면 같이 고친다.

server:
  host: 127.0.0.1
  port: 8080
  state_rate_hz: 30

ros:
  # Pi 펌웨어가 도메인 0으로 컴파일돼 있다(base_contract.md "ROS_DOMAIN_ID"). run.sh가 export한다.
  domain_id: 0
  topics:
    joint_states: /joint_states
    base_status: /base/status
    imu: /imu/data_raw            # MCU 원본. /imu/data는 공분산만 채운 사본이다
    odom: /odom
    odom_filtered: /odometry/filtered   # EKF(바퀴 + 자이로). 라이다 흔적을 쌓는 데만 쓴다
    marker_track: /marker_track
    detections: /aruco_detections
    image: /camera/image_raw/compressed
    camera_info: /camera/camera_info
    cmd_vel: /cmd_vel
    cmd_inputs:                   # twist_mux 입력. 어느 쪽이 지금 모는지 보여 준다
      teleop: /cmd_vel_teleop
      align: /cmd_vel_align
      nav: /cmd_vel_nav
      follow: /cmd_vel_follow
    phone_link: /phone/link_status
    app_status: /robot/app_status
    joy: /joy                     # 패드 연결 상태, 버튼과 십자키 입력
    trip_command: /phone/trip_command   # 운영 버튼 출발·멈춤이 여기로 낸다(앱 브리지와 같은 토픽)
    scan: /scan                   # RPLIDAR C1 (sllidar_ros2, laser_link)
    nav_command: /nav/command     # 작업 순서기 → Pi robot/errand_nav.py (JSON)
    nav_status: /nav/status
    nav_plan: /plan               # Nav2 전역 경로 (nav_msgs/Path)

robot:
  # mr_base/config 유효값. 바퀴 회전각 → 지면 속도 변환에 쓴다.
  wheel_radius_m: 0.04979
  # MCU base_config.h 값. /cmd_vel → 바퀴 목표 속도(역기구학)에 쓴다.
  mcu_wheel_radius_m: 0.050
  mcu_wheel_separation_m: 0.30912
  # 명령이 이보다 오래되면 목표 속도를 0으로 본다. MCU 워치독 200 ms보다 조금 길게.
  cmd_fresh_s: 0.25

camera:
  # compressed_image_transport 기본 JPEG 품질은 95라 720p30이 50 Mbps를 넘는다. 부스 Wi-Fi에는 무리라
  # 브리지가 Pi의 usb_cam 노드 파라미터(이름 끝이 jpeg_quality인 것)를 이 값으로 낮춘다. null이면 건드리지 않는다.
  # 압축 영상을 쓰는 것은 이 대시보드뿐이라 로봇 동작에는 영향이 없다.
  node: /camera/usb_cam
  jpeg_quality: 60
  # mr_description/config/robot_params.yaml: base_link z 0.050 + camera z 0.360.
  # marker_track.yaml camera_origin_xyz_m와 같다.
  optical_origin_m: [0.250, 0.000, 0.410]
  # /camera/camera_info를 받으면 그쪽을 쓴다. 이 값은 c920_calibration.yaml 사본(받기 전 대체값).
  width: 1280
  height: 720
  K: [955.4046808917496, 0.0, 680.6881205097441,
      0.0, 953.9151858754207, 402.5289587417247,
      0.0, 0.0, 1.0]
  D: [0.021758365731293736, -0.07377388572024729,
      -0.001476912295302247, 0.0014777700349652531, 0.0]

aruco:
  # 부스 마커는 디자이너가 8 cm로 인쇄했다(2026-10-31). aruco_tracker.yaml은 15 cm라 Pi 패드 노드가
  # /aruco_tracker marker_size를 이 값으로 맞춘다(scripts/robot.sh install이 booth.env로 넘긴다).
  marker_size_m: 0.08
  # marker_track.yaml. /aruco_detections는 보정 전 원시값이라 3D 표시에는 이 계수를 곱한다.
  pnp_translation_scale: 0.960729786
  # 영상과 검출을 같은 프레임으로 맞추려고 영상을 이만큼까지 붙잡아 둔다.
  sync_hold_s: 0.25

imu:
  # mr_description robot_params.yaml imu_xyz_m / imu_rpy_deg (2026-10-31 실측).
  xyz_m: [0.010, -0.160, 0.090]
  rpy_deg: [-1.0, 2.1, 177.5]

lidar:
  # 3D 화면에 스캔을 겹쳐 그린다. Pi 스택이 라이다를 띄워야 온다(stack.lidar). 안 오면 화면에서 빠질 뿐이다.
  enabled: true
  # mr_description robot_params.yaml lidar_xyz_m(base_link 기준) + base_link z 0.050, lidar_rpy_deg (2026-11-10 실측).
  # 화살표가 앞을 보게 달았고 드라이버가 화살표를 180°로 내서 yaw가 177.5°다.
  xyz_m: [0.018, -0.004, 0.250]
  rpy_deg: [0.0, 0.0, 177.5]
  # 이 안의 점은 로봇 자기 몸으로 보고 버린다. 라이다가 차체 틀 안에 있어 네 기둥이 늘 찍힌다
  # (2026-11-15 실측: 뒤 (-0.17, ±0.18), 앞 (0.22~0.29, ±0.13~0.20) m). 상자는 base_footprint 기준 [x0, x1, y0, y1].
  # robot/errand_nav.py의 lidar_self_box_m 기본값과 같아야 한다.
  self_radius_m: 0.20
  self_box_m: [-0.25, 0.31, -0.25, 0.25]
  max_range_m: 8.0
  # 벽으로 묶는 기준. 이웃 점이 gap_m(멀리서는 거리 × gap_ratio)보다 떨어지면 다른 물체로 끊는다.
  gap_m: 0.12
  gap_ratio: 0.06
  simplify_m: 0.03

nav:
  # 말로 시키는 이동("책상으로 가", "책상에서 약통 가져와", "돌아와"). Pi의 mr-booth@nav(robot/errand_nav.py)가 몬다.
  # 지도 없이 마커를 보고 가고, 출발한 자리는 오도메트리로 돌아온다. 앞이 막히면 라이다로 선다.
  enabled: true
  # 마커 앞 이 거리(base_footprint 기준)에서 선다. 장소마다 따로 줄 수 있다.
  standoff_m: 0.6
  # 접근 감지: 따라가는 중에 따라가는 사람이 아닌 누군가가 차체에 바짝(앞 0.40 m, 옆 0.25 m, 뒤 0.30 m) 붙으면
  # 서고 "가까이 오셨네요"라고 한다. 좁은 곳에서 벽에 걸려 자꾸 서면 false로 끄고 브링업을 다시 누른다.
  guard: true
  # "3번 마커 따라와"로 따라갈 때 유지하는 거리 [m]. 배지(stack.marker_id)는 추종 노드가 1.1 m로 따라간다.
  follow_range_m: 1.0
  # "뒤로 조금만", "앞으로 가"처럼 거리를 말하지 않았을 때 가는 거리 [m]와 "돌아 봐"의 각도 [deg]
  nudge_m: 0.3
  turn_deg: 90
  # 다녀오는 심부름("○○에서 △△ 가져와"): 번호로 말한 마커 앞에 설 거리 [m](팔이 닿게 가까이), 마커 정면에 맞춰 서기,
  # 도착해서 팔이 물건을 찾기 전에 기다리는 시간 [s](차체 흔들림이 가라앉고 작업대 높이 마커를 다시 잰다)
  fetch_standoff_m: 0.42
  fetch_align: true
  settle_s: 0.8
  # 장소 = 그곳에 붙여 둔 ArUco 마커(4X4_50, 배지와 같은 크기). 따라갈 배지(stack.marker_id)와 겹치지 않게 번호를 고른다.
  # label은 화면과 막내의 말에, aliases는 음성 모델이 알아들을 다른 이름으로 쓴다.
  # align: true면 마커 정면(법선 위)으로 먼저 옮겨 간 뒤 곧게 다가가 선다. 가까이(0.58 m 안쪽) 서는 장소는 켜 둔다:
  # 비스듬히 다가가면 책상 모서리가 차체 앞 통로에 걸려 "앞이 막혔어요"로 끝난다(2026-11-16 시뮬레이션에서 확인).
  places:
    desk: {label: 책상, marker_id: 5, standoff_m: 0.42, align: true, aliases: [테이블, 작업대]}
    door: {label: 현관, marker_id: 6, aliases: [문, 입구]}

battery:
  # 판정은 사용자 아티팩트 "배터리 잔량표"(2026-10-30, claude.ai/artifact/BkUGHXPsNzimrui8qNY4KC)를 따른다.
  # /base/status supply_voltage는 역극성 보호 다이오드(SR540) 뒤에서 재서 배터리 단자보다 낮다.
  # 실측: 10-30 단자 13.16 대 토픽 12.87, 10-31 단자 13.09 대 토픽 12.82.
  diode_drop_v: 0.30
  # 4S LiFePO4 휴지 전압(배터리 단자) → 잔량. 30~80 %가 0.3 V 안에 몰려 있어서 화면에는 ±0.05 V가
  # 만드는 잔량 범위를 같이 보인다. 주행 중에는 처져서 낮게 나온다.
  soc_table:
    - [11.20, 0]
    - [12.00, 5]
    - [12.40, 10]
    - [12.85, 20]
    - [13.00, 30]
    - [13.05, 40]
    - [13.10, 50]
    - [13.15, 60]
    - [13.20, 70]
    - [13.28, 80]
    - [13.36, 90]
    - [13.42, 95]
    - [13.60, 100]
  # 판정 기준은 토픽 값. 아래로 내려가면 충전 권장(단자 약 12.9 V, 잔량 약 20 %), 즉시 충전(셀당 약 3.07 V).
  # 표 맨 위 - 다이오드 + 0.05 V보다 높으면 충전 중이거나 막 뗀 표면 전압으로 본다.
  charge_at_v: 12.6
  stop_at_v: 12.0
  filter_tau_s: 20.0

cloud:
  # mr_care_telemetry 설정과 같은 DB. 서비스 계정이 없으면 클라우드 칸은 "확인 불가"로 남는다.
  enabled: true
  robot_id: mr-001
  database_url: https://senior-care-nyr-default-rtdb.asia-southeast1.firebasedatabase.app
  service_account_path: ~/.config/mr_care_telemetry/service-account.json
  telemetry_src: ~/dev/mobile-robot/software/ros_pkgs/mr_care_telemetry
  status_period_s: 3.0
  # 대시보드가 쓰는 온라인 판정과 같다(care-telemetry README 3.1).
  online_age_s: 15.0

pi:
  # 전원 저전압 이력이 있는 Pi라 온도·스로틀을 같이 본다. ssh가 안 되면 칸이 비어 있을 뿐이다.
  enabled: true
  ssh_host: rpi5
  period_s: 5.0

stack:
  # Pi 스택(robot/, systemd mr-booth.target). scripts/robot.sh install이 Pi ~/booth/booth.env로 옮긴다.
  # 추적할 ArUco ID. follow.launch.py 기본값은 0이라 넘기지 않으면 조끼(0)를 찾는다.
  marker_id: 2
  # 패드 A·대시보드 출발이 앱에 보일 출발지·목적지 (config/places.yaml 키)
  trip_from: place_home
  trip_to: place_senior_center
  # 전방 카메라(C920)가 꽂힌 곳. laptop이면 run.sh가 ros/front_camera.launch.py(카메라 + ArUco 검출)를
  # 노트북에서 띄우고 Pi의 follow는 카메라 없이 뜬다. pi면 예전처럼 Pi가 전부 띄운다.
  front_camera: laptop
  # Pi follow 스택에 라이다(sllidar_ros2)를 같이 띄운다. 3D 화면의 스캔과 이동 중 장애물 정지에 쓴다.
  # 꺼도 이동은 된다(장애물을 못 볼 뿐). Pi 전원이 약하면(저전압 이력) 꺼 본다.
  lidar: true
  # 대시보드가 보여 주는 유닛 순서. mr-booth@NAME
  units: [follow, phone_bridge, mission, telemetry, pad, nav]

# 로봇팔 데몬(arm/maknae_arm, scripts/arm.sh). 꺼 두면 팔 칸과 심부름 도구가 빠진다.
arm:
  enabled: true
  url: http://127.0.0.1:8091
  period_s: 0.1
  # 패드 B(멈춤)를 누르면 바퀴(Pi 쪽)와 함께 팔도 선다. null이면 끈다.
  lb_button: 6
  rt_axis: 4                       # BLE Xbox joydev ABS_GAS
  stop_button: 1

# 아바타 음성 대화. Gemini Live에 브라우저가 직접 붙고, 브리지는 한 번 쓰는 임시 토큰만 발급한다.
# 자기소개(녹음 파일)와 고정 대사(web/public/avatar/clips)는 인터넷 없이도 나온다.
live:
  enabled: true
  provider: gemini
  model: gemini-3.8-live
  # 미리 만들어진 목소리 이름. 밝은 여성 목소리 후보: Leda, Aoede, Zephyr, Autonoe, Laomedeia
  voice: Leda
  key_env_file: ~/.config/mobile-robot/gemini.env
  # 대화 대답을 누구 목소리로 낼지의 기본값. 화면의 컨트롤 패널(키 C)에서 바꾸면 그 브라우저에 저장된다.
  #   gemini  Gemini Live가 바로 말한다 (가장 빠르다)
  #   hina    Gemini가 한 말을 문장마다 ElevenLabs Hina로 다시 읽힌다 (고정 대사와 같은 목소리, 조금 늦다)
  chat_voice: gemini
  tts:
    key_env_file: ~/.config/mobile-robot/elevenlabs.env
    model: eleven_v4_turbo
    voice_id: lhTvHflPVOqgSWyuWQry
    stability: 0.4
    similarity_boost: 0.75
    speed: 1.1
  # 아무도 말을 걸지 않을 때 이 간격[s]으로 호객 대사를 튼다. 0이면 끈다.
  attract_s: 0
  # 패드 Y를 누르고 있는 동안 듣는다. BLE Xbox 패드의 /joy 번호: A 0, B 1, X 3, Y 4, LB 6, RB 7, View 10, Menu 11.
  ptt_button: 4

# 앞 보기(음성 도구 look_front). "앞에 뭐가 보여?", "나 보여?", "손에 든 거 뭐야?"처럼 물을 때만
# 전방 카메라(C920) 한 장을 이 모델에 보여 주고 짧은 답을 받아 대화 모델에 넘긴다.
# 대화 세션(Live)에 사진을 넣지 않는 까닭: Live는 턴마다 세션 문맥 전체를 다시 입력으로 센다. 사진을 넣으면 대화가 끝날 때까지 매 턴 그 값을 낸다.
look:
  enabled: true
  # 2026-11-16 같은 사진 비교(한 장, LOW): 3.5 Flash-Lite 1.2 s · 4 Hydrogen 4.3 s(생각을 끌 수 없어 450토큰쯤 생각한다) · 4 Argon 7~9 s
  # 가격(100만 토큰, 입력/출력): Flash-Lite 0.30/2.50, Hydrogen 1.50/7.50, Argon 2/10(12-01부터 4/20)
  model: gemini-3.5-flash-lite
  # 사진 한 장을 몇 토큰으로 볼지: LOW 약 270 / MEDIUM 약 540 / HIGH 약 1070. MEDIUM은 0.5 s쯤 늦고 조금 더 자세하다
  media_resolution: MEDIA_RESOLUTION_LOW
  # Flash-Lite는 minimal까지 내릴 수 있다. Hydrogen·Argon으로 바꾸면 low로 둔다(minimal을 거절한다)
  thinking_level: minimal
  # 생각 토큰도 여기에 들어간다. 너무 작으면 생각하다 끊겨 빈 답이 온다
  max_output_tokens: 800
  # 이보다 오래된 영상이면 카메라가 끊긴 것으로 보고 거절한다
  max_age_s: 2.0
  timeout_s: 12
